<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>
<style>
:root{--bg:#e2e7e1;--card:#f3f5f2;--dark:#1b1b1d;--accent:#7c4dff;--nav1:#a68bff;--nav2:#3c2480;--tint:#ece6ff;--tintx:#4a2fb3;--txt:#111;--mut:#6e7570;--ok:#4caf6a;--bad:#d9605f}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-size:14.5px}
button,input,select{font:inherit}
button{color:inherit}
input,select{color:var(--txt);color-scheme:light}
input::placeholder{color:#8a918b}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border-radius:28px;padding:32px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.box h1{font-size:20px}
input,select{border:1px solid #cfd5ce;background:#fff;border-radius:12px;padding:11px 14px;width:100%}
.btn{background:var(--dark);color:#fff;border:0;border-radius:40px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--txt);border:1px solid #cfd5ce}
.erro{color:var(--bad);font-size:11.5px;min-height:16px}
/* app */
#app{display:flex;min-height:100vh}
nav{background:linear-gradient(180deg,var(--nav1),var(--nav2));width:68px;padding:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:sticky;top:0;height:100vh}
nav button{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:rgba(255,255,255,.75);display:grid;place-items:center;cursor:pointer}
nav button:hover{background:rgba(255,255,255,.15)}
nav button.on{background:rgba(255,255,255,.28);color:#fff}
.tit{display:inline-flex;align-items:center;gap:8px}
.cores{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--txt)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#f44,#fc4,#4d4,#4dd,#44f,#f4f,#f44)}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}

main{flex:1;padding:28px;max-width:1440px;margin:0 auto;width:100%}
.topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap}
.topo h2{font-size:21.5px}
.quem{font-size:11.5px;color:var(--mut);display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:var(--card);border-radius:28px;padding:24px}
.card h3{font-size:14.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.item{background:#fff;border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.item small{color:var(--mut);display:block}
.item.arrastando{opacity:.65;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:5}
.grip{cursor:grab;color:var(--mut);touch-action:none;user-select:none;-webkit-user-select:none;padding:6px 4px;font-size:15px;line-height:1;letter-spacing:-3px;flex-shrink:0}
.grip:active{cursor:grabbing}
.item .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px}
.total{display:flex;justify-content:space-between;font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid #d9ded8}
.vazio{color:var(--mut);font-size:12.5px}
.meses{display:flex;align-items:center;gap:10px}
.meses button{border:0;background:rgba(0,0,0,.06);border-radius:50%;width:34px;height:34px;cursor:pointer}
.pill{padding:4px 12px;border-radius:40px;font-size:11px;font-weight:700}
.pill.pago{background:#dff3e4;color:var(--ok)}.pill.aberto{background:#f9e0e0;color:var(--bad)}
.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:20px}
@media(max-width:700px){main{padding:16px}.form{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid #d9ded8}
th:first-child,td:first-child{text-align:left}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.hero{margin-bottom:20px}.hero h1{font-size:27px}.hero p{color:var(--mut);margin-top:4px}
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}@media(max-width:1000px){.home{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}.col .hero{margin-bottom:0}
.mods{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.mod{cursor:pointer}.mod:hover{background:#fff}
.fin-t{font-size:15px;font-weight:700;margin:4px 0 12px}
.fin-g{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:560px){.fin-g{grid-template-columns:1fr}}
.lin{display:flex;justify-content:space-between;padding:6px 0;font-size:12.5px}
.sem{display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));gap:8px;overflow-x:auto}
.dia{background:#fff;border-radius:16px;padding:10px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.dia b{font-size:11px;color:var(--mut);font-weight:600}.dia>span{font-size:18px;font-weight:700}
.dia.hoje>span{color:var(--accent)}.dia.sel{border-color:var(--accent)}
.chip{display:flex;justify-content:space-between;gap:4px;background:var(--tint);color:var(--tintx);border-radius:8px;padding:4px 7px;font-size:11px;line-height:1.25}
.chip button{border:0;background:none;opacity:.6;cursor:pointer;line-height:1;padding:0 2px}
.addrow{display:flex;gap:8px;margin-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal small{color:var(--mut);font-size:11px;padding:4px 0}
.cal button{position:relative;aspect-ratio:1;border:0;background:transparent;border-radius:50%;font-size:12.5px;cursor:pointer}
.cal button:hover{background:rgba(0,0,0,.06)}
.cal button.hoje{background:var(--accent);color:#fff;font-weight:700}
.cal button.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal em{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#e5484d}
.cal button.hoje em{background:#fff}
.dir h3{font-size:12.5px}
.dir .meses>span{font-size:11.5px!important;min-width:100px!important}
.dir .meses button{width:28px;height:28px;font-size:12.5px}
.dir .cal small{font-size:10.5px}
.dir .cal button{font-size:11.5px}
.dir input{font-size:11.5px;padding:8px 12px}
.dir .btn{font-size:11.5px;padding:8px 16px}
.dir .item{font-size:11.5px;padding:10px 12px}
.dir .item small{font-size:11px}
.dir .vazio{font-size:11.5px}
.lk{text-decoration:none;color:inherit}.lk:hover{background:var(--tint)}
.fch{display:inline-flex;align-items:center;background:#fff;border-radius:40px}
.fch>button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:12.5px;border-radius:40px}
.fch>button.fx{padding:7px 10px 7px 0;opacity:.6}
.fch.on{background:var(--accent);color:#fff}
.fab{position:fixed;right:28px;bottom:28px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--nav1),var(--nav2));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:40}
.fab:hover{transform:scale(1.06)}
.item.edt{cursor:pointer}.item.edt:hover{background:var(--tint)}
.nf{font-size:9.5px;letter-spacing:.06em;font-weight:600;color:var(--mut);border:1px solid #cfd5ce;border-radius:4px;padding:1px 5px}
/* ajustes de layout: raios em escala, sem sobreposição, semana mais alta */
.card{border-radius:18px;padding:22px 24px}
.box{border-radius:18px}
.soon{border-radius:18px}
.item{border-radius:10px}
.card h3{gap:10px;flex-wrap:wrap;row-gap:6px}
.card h3>span:first-child{min-width:0}
.tit{min-width:0}
.pill{white-space:nowrap;flex-shrink:0}
.mods{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.sem{grid-template-columns:repeat(7,minmax(104px,1fr));gap:8px;padding-bottom:4px}
.dia{border-radius:12px;padding:12px;min-height:190px;min-width:0}
.chip{border-radius:6px;padding:5px 8px;align-items:flex-start;min-width:0}
.chip>span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.chip button{flex-shrink:0}
.item>div:first-child{min-width:0;overflow-wrap:anywhere}
.item>div:last-child{flex-shrink:0}
.st{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.st-p{background:#fff2d6;color:#8a6100}.st-a{background:#dff3e4;color:#2f7d4a}.st-c{background:#f9e0e0;color:#b04545}
.motivo{color:#b04545!important}
.card h3 .meses{flex-wrap:wrap;justify-content:flex-end}
.motivo-box{background:#f9e0e0;color:#8f3535;border-radius:10px;padding:10px 12px;font-size:13px}
.gc{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;align-items:start}
.gc-side{display:flex;flex-direction:column;gap:20px;position:sticky;top:20px}
.gc-criar{align-self:flex-start;padding:12px 24px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.gc-mini{background:var(--card);border-radius:18px;padding:12px}
.gc-minih{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-bottom:6px}
.gc-minih button{border:0;background:none;cursor:pointer;font-size:16px;padding:2px 8px}
.gc-agt{font-size:12.5px;font-weight:700;margin-bottom:6px}
.gc-ag{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.gc-ag label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0}
.gc-ag .x{opacity:.5}
.gc-main{background:var(--card);border-radius:18px;padding:16px;min-width:0}
.gc-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.gc-bar h2{font-size:18px;font-weight:600;margin-right:auto}
.gc-seg{display:inline-flex;border:1px solid #cfd5ce;border-radius:40px;overflow:hidden;background:#fff}
.gc-seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:12.5px}
.gc-seg button.on{background:var(--tint);color:var(--tintx);font-weight:700}
.gc-wrap{overflow-x:auto}
.gc-mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #d9ded8;border-left:1px solid #d9ded8;min-width:640px}
.gc-mes .h{padding:6px;font-size:11px;color:var(--mut);text-align:center;border-right:1px solid #d9ded8;border-bottom:1px solid #d9ded8;background:#fff}
.gc-cel{min-height:116px;border-right:1px solid #d9ded8;border-bottom:1px solid #d9ded8;padding:4px;cursor:pointer;background:#fff;min-width:0;display:flex;flex-direction:column;gap:2px}
.gc-cel:hover{background:#fafbf9}.gc-cel.fora{background:#f4f6f3}.gc-cel.fora .gc-n{color:var(--mut)}
.gc-n{font-size:12px;min-width:24px;height:24px;border-radius:12px;padding:0 6px;display:grid;place-items:center;align-self:flex-start}
.gc-n.hoje{background:var(--accent);color:#fff;font-weight:700}
.gc-ev{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:1px 6px;font-size:11.5px;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:transparent}
.gc-ev:hover{background:rgba(0,0,0,.06)}
.gc-ev i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.gc-mais{border:0;background:none;font-size:11.5px;color:var(--mut);text-align:left;padding:1px 6px;cursor:pointer}
.gc-grade{min-width:640px}
.gc-hd{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));border-top:1px solid #d9ded8;background:#fff}
.gc-dh{text-align:center;padding:6px 0;cursor:pointer;border-left:1px solid #d9ded8}
.gc-dh small{display:block;font-size:11px;color:var(--mut)}
.gc-dh b{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:15px;font-size:16px;font-weight:600}
.gc-dh.hoje b{background:var(--accent);color:#fff}
.gc-ad{border-bottom:1px solid #d9ded8}
.gc-lbl{font-size:10px;color:var(--mut);text-align:right;padding:6px 6px 0 0}
.gc-dt{border-left:1px solid #d9ded8;padding:3px;display:flex;flex-direction:column;gap:2px;min-height:26px;cursor:pointer}
.gc-tg{max-height:600px;overflow-y:auto;background:#fff}
.gc-body{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr))}
.gc-horas div{height:48px;font-size:10px;color:var(--mut);text-align:right;padding-right:6px;position:relative;top:-6px}
.gc-col{position:relative;height:1152px;border-left:1px solid #d9ded8;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,#e6eae4 47px,#e6eae4 48px);cursor:pointer}
.gc-t{position:absolute;border-radius:6px;border-left:3px solid;padding:2px 6px;font-size:11.5px;line-height:1.3;overflow:hidden;cursor:pointer;color:var(--txt)}
.gc-agora{position:absolute;left:0;right:0;height:2px;background:#e5484d;z-index:3;pointer-events:none}
.fab.gc-lupa{bottom:98px;width:48px;height:48px}
.impl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #e6eae4}
.impl>div{flex:1;min-width:0}.impl b{font-size:13px;display:block}.impl small{display:block;color:var(--mut);font-size:11.5px}
.impl.dup{opacity:.55}.impl input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent)}
.impl button{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px;padding:4px 7px;border-radius:8px}
.impl button:hover{background:rgba(0,0,0,.06);color:var(--txt)}
.imped{display:grid;grid-template-columns:1fr 1fr 96px auto;gap:6px;align-items:center}.imped input{padding:8px 10px;font-size:13px;min-width:0}
.impste{display:flex;gap:8px;font-size:12px;color:var(--mut)}.impste b{color:var(--txt)}
@media(max-width:560px){.imped{grid-template-columns:1fr 1fr}}
.bn-row{display:flex;flex-wrap:wrap;gap:10px}
.bn{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 12px;border-left:5px solid;flex:1 1 170px;max-width:270px;min-width:0}
.bn>div{min-width:0}.bn b{font-size:13px;display:block}.bn small{display:block;color:var(--mut);font-size:11px}
.bn.feito{opacity:.55}.bn.feito b{text-decoration:line-through}
.bn .ck{margin-left:auto;flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:13px;color:#fff}
.bnl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #e6eae4;font-size:13px}
.bnl i{width:12px;height:12px;border-radius:50%;flex-shrink:0}.bnl>div{flex:1;min-width:0}.bnl small{display:block;color:var(--mut);font-size:11px}
.bnl button{border:0;background:none;cursor:pointer;font-size:12px;padding:4px 8px;border-radius:8px;color:var(--tintx)}
.bnd{display:flex;gap:6px;flex-wrap:wrap}.bnd label{display:flex;align-items:center;gap:4px;font-size:12px;border:1px solid #cfd5ce;border-radius:20px;padding:5px 10px;cursor:pointer;background:#fff}
@media(max-width:900px){.gc{grid-template-columns:1fr}.gc-side{display:none}}
.evrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{border:2px dashed #c3cac2;border-radius:28px;padding:24px;color:var(--mut)}
</style>
</head>
<body>

<section id="login" class="hide">
  <div class="box">
    <h1>Entrar</h1>
    <input id="email" type="email" placeholder="E-mail" autocomplete="username">
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="erro" id="loginErro"></div>
    <button class="btn" onclick="login()">Entrar</button>
  </div>
</section>

<div id="app" class="hide">
  <nav id="menu"></nav>
  <main>
    <div class="topo">
      <h2 id="titulo"></h2>
      <div class="quem"><span id="quem"></span><button class="btn sec" onclick="sair()">Sair</button></div>
    </div>
    <div id="conteudo"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// ============ CONFIGURAÇÃO (Supabase > Project Settings > API) ============
const SUPABASE_URL = 'https://urccqopviggwnduckeut.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vds8BbFzoAtPm0xDHBUkGg_9jLk1r9J';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// Rede de segurança: qualquer consulta que volte com erro avisa na tela (nenhuma falha fica silenciosa).
(function () {
  let p = sb.from('profiles').select('*'); while (p && !Object.prototype.hasOwnProperty.call(p, 'then') && !Object.prototype.hasOwnProperty.call(Object.getPrototypeOf(p) || {}, 'then')) p = Object.getPrototypeOf(p);
  const proto = Object.prototype.hasOwnProperty.call(p, 'then') ? p : Object.getPrototypeOf(p), orig = proto.then;
  proto.then = function (ok, bad) {
    return orig.call(this, r => { if (r && r.error) erroBanco(r.error); return ok ? ok(r) : r; }, bad);
  };
})();
function erroBanco(e) {
  const m = String(e.message || e);
  if (/jwt|token/i.test(m)) { aviso('Sua sessão expirou. Entre novamente.'); setTimeout(sair, 1800); return; }
  aviso('Erro ao falar com o banco: ' + m);
}
window.addEventListener('unhandledrejection', e => { aviso('Algo deu errado: ' + (e.reason?.message || e.reason)); });
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

const hoje = new Date();
const S = { user:null, perfil:null, modulos:[], perm:{}, mes:{ano:hoje.getFullYear(), mes:hoje.getMonth()} };
const mesKey = (a, m0) => `${a}-${String(m0 + 1).padStart(2, '0')}-01`;   // chave do mês: data do dia 1 (2026-10-01)
const parseMes = k => { const [a, m] = k.split('-').map(Number); return [a, m - 1]; };   // [ano, mês 0-11]
const chaveMes = () => mesKey(S.mes.ano, S.mes.mes);
const ehAdmin = () => !!S.perfil?.is_admin;
const podeVer = m => ehAdmin() || !!S.perm[m]?.pode_ver;
const podeLancar = m => ehAdmin() || (!!S.perm[m]?.pode_ver && !!S.perm[m]?.pode_lancar);

// ============ AVISOS E CONFIRMAÇÃO (sem janelas do navegador) ============
function confirmar(msg, ok = 'Excluir') {
  return new Promise(res => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:100;padding:20px';
    d.innerHTML = `<div class="box" style="max-width:340px"><p>${esc(msg)}</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" id="cNao">Cancelar</button><button class="btn" id="cSim">${esc(ok)}</button></div></div>`;
    document.body.appendChild(d);
    const fim = v => { d.remove(); res(v); };
    d.querySelector('#cSim').onclick = () => fim(true);
    d.querySelector('#cNao').onclick = () => fim(false);
    d.onclick = e => { if (e.target === d) fim(false); };
  });
}
function aviso(msg) {
  document.querySelectorAll('.toast-av').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast-av';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:40px;font-size:13px;z-index:101;max-width:90%';
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

// ============ ÍCONES E TEMA DE CORES ============

const ico = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${ICONS[k] || ICONS.pasta}</svg>`;

const TEMAS = [{n:'Roxo',c:'#7c4dff'},{n:'Azul',c:'#2f80ed'},{n:'Verde',c:'#2e9e6b'},{n:'Amarelo',c:'#e0a800'},{n:'Laranja',c:'#ee7a2c'},{n:'Rosa',c:'#e0558f'},{n:'Grafite',c:'#5b6470'}];
function hexHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0; if (d) { h = mx === r ? ((g-b)/d) % 6 : mx === g ? (b-r)/d + 2 : (r-g)/d + 4; h = Math.round(h*60); if (h < 0) h += 360; }
  const l = (mx+mn)/2, s = d ? d/(1-Math.abs(2*l-1)) : 0;
  return [h, Math.round(Math.min(s, .8)*100)];
}
function temaSalvo() { try { return localStorage.getItem('tema'); } catch (e) { return null; } }
function aplicarTema(hex) {
  const [h, s] = hexHsl(hex), st = document.documentElement.style;
  st.setProperty('--nav1', `hsl(${h} ${s}% 64%)`);
  st.setProperty('--nav2', `hsl(${h} ${s}% 26%)`);
  st.setProperty('--accent', `hsl(${h} ${s}% 46%)`);
  st.setProperty('--tint', `hsl(${h} ${s}% 92%)`);
  st.setProperty('--tintx', `hsl(${h} ${s}% 28%)`);
  try { localStorage.setItem('tema', hex); } catch (e) {}
}
function blocoCores() {

// ============ SESSÃO ============
async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  session ? entrar(session.user) : $('login').classList.remove('hide');
}
async function login() {
  $('loginErro').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('senha').value });
  if (error) {
    const m = String(error.message || '');
    $('loginErro').textContent = SUPABASE_URL.includes('COLE_AQUI') ? 'Este arquivo está sem a URL do Supabase: use a versão preenchida.'
      : /invalid login|invalid credentials/i.test(m) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + m;
    return;
  }
  $('login').classList.add('hide');
  entrar(data.user);
}
async function sair() { await sb.auth.signOut(); location.hash = ''; location.reload(); }

async function entrar(user) {
  S.user = user;
  const [p, m, pe] = await Promise.all([
    sb.from('profiles').select('*').eq('id', user.id).single(),
    sb.from('modulos').select('*').order('ordem'),
    sb.from('permissoes').select('*').eq('user_id', user.id)
  ]);
  if (p.error || !p.data || m.error) {
    $('app').classList.remove('hide'); $('menu').classList.add('hide');
    $('conteudo').innerHTML = `<p class="vazio">Não foi possível carregar seu perfil${p.error ? ': ' + esc(p.error.message) : '. Peça ao administrador para conferir o seu cadastro'}.</p><button class="btn sec" onclick="sair()">Sair</button>`;
    return;
  }
  S.perfil = p.data;
  S.perm = Object.fromEntries((pe.data || []).map(x => [x.modulo_id, x]));
  S.modulos = (m.data || []).filter(x => podeVer(x.id));
  $('quem').textContent = S.perfil?.nome || user.email;
  $('app').classList.remove('hide');
  montarMenu();
  if (!location.hash) location.hash = ehAdmin() ? '#home' : (S.modulos[0] ? '#m/' + S.modulos[0].id : '#home');
  rotear();
}

// ============ MENU E ROTAS ============
function montarMenu() {
  $('menu').classList.toggle('hide', !ehAdmin() && S.modulos.length <= 1);
  let h = '';
  if (ehAdmin()) h += `<button data-r="home" title="Início">${ico('home')}</button>`;
  if (ehAdmin()) h += `<button data-r="cal" title="Calendário">${ico('cal')}</button>`;
  S.modulos.forEach(m => h += `<button data-r="m/${m.id}" title="${esc(m.nome)}">${ico(m.id)}</button>`);
  if (ehAdmin()) h += `<button data-r="work" title="Work">${ico('work')}</button>`;
  if (ehAdmin()) h += `<button data-r="links" title="Links">${ico('links')}</button>`;
  if (ehAdmin()) h += `<button class="fim" data-r="cfg" title="Configurações">${ico('cfg')}</button>`;
  $('menu').innerHTML = h;
  $('menu').onclick = e => { const b = e.target.closest('button'); if (b) location.hash = '#' + b.dataset.r; };
}
window.addEventListener('hashchange', () => S.user && rotear());

function rotear() {
  const r = location.hash.slice(1) || 'home';
  document.querySelectorAll('#menu button').forEach(b => b.classList.toggle('on', b.dataset.r === r));
  if (r === 'cal' && ehAdmin()) return telaCalendario();
  if (r === 'work' && ehAdmin()) return telaWork();
  if (r === 'links' && ehAdmin()) return telaLinks();
  if (r === 'cfg' && ehAdmin()) return telaConfig();
  if (r.startsWith('m/')) {
    const m = S.modulos.find(x => x.id === r.slice(2));
    if (m) return telaModulo(m);
  }
  if (ehAdmin() || !S.modulos.length) return telaHome();
  location.hash = '#m/' + S.modulos[0].id;
}

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const inicioSemana = d => { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); x.setHours(0,0,0,0); return x; };

const bnDiasTxt = d => !d || !d.length ? 'só em datas avulsas' : d.length === 7 ? 'todo dia' : (d.join() === '1,2,3,4,5' ? 'seg a sex' : [...d].sort().map(i => DIAS[i]).join(', '));
function bnHojeHtml(banners, datas, feitos, hojeK) {
  const wd = new Date(hojeK + 'T00:00:00').getDay(), itens = [];
  datas.filter(x => x.data === hojeK).forEach(x => { const b = banners.find(y => y.id === x.banner_id); if (b) itens.push({ b, hora: x.hora || b.hora, obs: x.obs }); });
  banners.filter(b => (b.dias || []).includes(wd) && !itens.some(i => i.b.id === b.id)).forEach(b => itens.push({ b, hora: b.hora, obs: null }));
  itens.sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99') || a.b.nome.localeCompare(b.b.nome));
  const corpo = itens.map(({ b, hora, obs }) => {
    const f = feitos.some(x => x.banner_id === b.id);
    return `<div class="bn ${f ? 'feito' : ''}" style="background:${hexRgba(b.cor, .14)};border-color:${b.cor}"><div><b>${esc(b.nome)}</b><small>${[hora, obs].filter(Boolean).map(esc).join(' · ') || 'o dia todo'}</small></div><button class="ck" style="border-color:${b.cor};${f ? 'background:' + b.cor : 'color:transparent'}" onclick="bnFeito('${b.id}',${f})" title="${f ? 'Desmarcar' : 'Marcar como feito'}">✓</button></div>`;
  }).join('');
  return `<div class="card"><h3><span>HOJE</span><button class="btn sec" style="padding:2px 12px;font-size:18px;line-height:1.2" onclick="abrirBanners()" title="Cadastrar banners">+</button></h3>${corpo ? `<div class="bn-row">${corpo}</div>` : '<p class="vazio">Nada fixo para hoje. Clique no + para cadastrar suas rotinas.</p>'}</div>`;
}
async function bnFeito(id, ja) {
  const k = iso(new Date());
  const { error } = ja ? await sb.from('banner_feitos').delete().eq('banner_id', id).eq('data', k) : await sb.from('banner_feitos').insert({ banner_id: id, data: k });
  if (error) return aviso('Não foi possível atualizar: ' + error.message);
  telaHome();
}

function dialogBanner(id) {

  modalCal('dlgBn2', `<h3 style="font-size:17px">${b ? 'Editar banner' : 'Novo banner'}</h3>

// ---- arrastar para reordenar os lançamentos de uma coluna ----
let DRAG = null;
function gripDown(ev) {
  ev.preventDefault(); ev.stopPropagation();
  const item = ev.currentTarget.closest('.item');
  DRAG = { item, card: item.parentElement, moved: false };
  item.classList.add('arrastando');
  document.addEventListener('pointermove', gripMove);
  document.addEventListener('pointerup', gripUp);
  document.addEventListener('pointercancel', gripUp);
}
function gripMove(ev) {
  if (!DRAG) return;
  const { item, card } = DRAG, todos = [...card.querySelectorAll('.item[data-id]')], idx = todos.indexOf(item);
  // posição desejada: quantos dos outros itens estão acima do ponteiro. Move os vizinhos, não o item arrastado.
  const t = todos.filter(s => s !== item && ev.clientY > s.getBoundingClientRect().top + s.getBoundingClientRect().height / 2).length;
  if (t === idx) return;
  if (t < idx) { let n = item; todos.slice(t, idx).forEach(x => { n.after(x); n = x; }); }
  else todos.slice(idx + 1, t + 1).forEach(x => card.insertBefore(x, item));
  DRAG.moved = true;
}
async function gripUp() {
  document.removeEventListener('pointermove', gripMove);
  document.removeEventListener('pointerup', gripUp);
  document.removeEventListener('pointercancel', gripUp);
  if (!DRAG) return;
  const { item, card, moved } = DRAG; DRAG = null; item.classList.remove('arrastando');
  if (!moved) return;
  const ids = [...card.querySelectorAll('.item[data-id]')].map(x => x.dataset.id);
  const rs = await Promise.all(ids.map((id, i) => sb.from('lancamentos').update({ ordem: i + 1 }).eq('id', id)));
  if (rs.some(r => r.error)) aviso('Não foi possível salvar a nova ordem.');
  rotear();
}

async function salvarLancamento() {
  const { mid, orig } = S.edit, nome = $('lNome').value.trim(), valor = parseFloat($('lValor').value), dono = $('lDono').value;
  const pct = dono.startsWith('ambos') ? parseFloat($('lPct').value) : 50;

  if (isNaN(pct) || pct < 0 || pct > 100) return aviso('A porcentagem de quem pagou deve ficar entre 0 e 100.');
  let linhas = [];
  if (orig) {
    linhas = montarLinhas(mid, orig.mes, nome, valor, dono, { criado_em: orig.criado_em, ordem: orig.ordem ?? null, serie: orig.serie || null, parcela: orig.parcela || null, parcelas: orig.parcelas || null }, pct);
  } else {
    const n = Math.max(1, Math.min(36, parseInt($('lRep').value) || 1)), serie = n > 1 ? crypto.randomUUID() : null;

  const ins = await sb.from('lancamentos').insert(linhas).select('id');
  if (ins.error) return aviso('Não foi possível salvar: ' + ins.error.message);

      return aviso('Não foi possível alterar o lançamento. Nada foi mudado.');
    }
  }
  fecharLanc(); rotear();
}

function wRef() {

  const rateio = n > 1 && !isNaN(v) ? `${n}x de ${brl(v / n)}. ` : '';
  $('wDica').textContent = modo === 'ent' ? 'A alteração vale só para este mês' + (S.w.item?.serie ? ', exceto responsável, contato e nota fiscal, que valem para todas as parcelas.' : '.')

    : n > 1 && !isNaN(v) ? (modo === 'novo' ? 'Entra direto nas entradas, sem passar por orçamento. ' : '') + `${n}x de ${brl(v / n)}, de ${mes} em diante. Cada parcela fica independente e pode ser editada.` : (modo === 'novo' ? 'Entra direto nas entradas, sem passar por orçamento. ' : '') + `Entra só em ${mes}.`;
}
async function salvarWork() {
  const { modo, item } = S.w, cliente = $('wCli').value.trim(), descricao = $('wDesc').value.trim(), valor = parseFloat($('wVal').value);
  if (!cliente || isNaN(valor) || valor <= 0) return aviso('Preencha o cliente e o valor.');
  const tipo = modo === 'novo' ? $('wTipo').value : modo === 'orc' ? 'orc' : 'ent';
  const nPar = Math.max(1, Math.min(36, parseInt($('wPar').value) || 1)), dataL = $('wData').value || iso(new Date()), dd = new Date(dataL + 'T00:00:00');
  const contatoCampos = { responsavel: $('wResp').value.trim(), contato: $('wCont').value.trim(), data_lancamento: dataL, nota_fiscal: $('wNF').checked };
  const orcCampos = tipo === 'orc' ? { ...contatoCampos, parcelas: nPar, mes: mesKey(dd.getFullYear(), dd.getMonth()) } : {};
  let r;
  if (modo === 'ent') {
    r = await sb.from('freela_entradas').update({ cliente, descricao, valor, ...contatoCampos }).eq('id', item.id);
    if (!r.error && item.serie) await sb.from('freela_entradas').update({ responsavel: contatoCampos.responsavel, contato: contatoCampos.contato, nota_fiscal: contatoCampos.nota_fiscal }).eq('serie', item.serie);
  }
  else if (modo === 'orc') r = await sb.from('orcamentos').update({ cliente, descricao, valor, ...orcCampos }).eq('id', item.id);
  else if (tipo === 'orc') r = await sb.from('orcamentos').insert({ cliente, descricao, valor, status: 'aberto', ...orcCampos });
  else {
    const n = nPar, c = Math.round(valor * 100), base = Math.floor(c / n), resto = c - base * n, serie = n > 1 ? crypto.randomUUID() : null;
    const linhas = Array.from({ length: n }, (_, i) => {
      const d = new Date(S.mes.ano, S.mes.mes + i, 1);
      return { cliente, descricao, recebido: false, valor: (base + (i < resto ? 1 : 0)) / 100, mes: mesKey(d.getFullYear(), d.getMonth()), ...contatoCampos, ...(modo === 'aprovar' ? { aprovado_em: iso(new Date()) } : {}), ...(n > 1 ? { serie, parcela: i + 1, parcelas: n } : {}) };
    });
    r = await sb.from('freela_entradas').insert(linhas);
    if (!r.error && modo === 'aprovar') r = await sb.from('orcamentos').update({ status: 'aprovado', parcelas: n, aprovado_em: iso(new Date()), ...contatoCampos }).eq('id', item.id);
  }
  if (r.error) return aviso('Não foi possível salvar: ' + r.error.message);
  $('dlgWork')?.remove(); rotear();
}
async function marcarRecebido(id, v) { await sb.from('freela_entradas').update({ recebido: v }).eq('id', id); rotear(); }
async function delWork(tabela, id) {
  if (!await confirmar(tabela === 'orcamentos' ? 'Excluir este orçamento?' : 'Excluir esta entrada? Só neste mês.')) return;
  await sb.from(tabela).delete().eq('id', id); rotear();
}

const normFone = v => { const d = String(v || '').replace(/\D/g, ''); return d && d.length <= 11 ? '55' + d : d; };
const ehRepasse = i => !i.grupo && i.dono === 'outro';   // gasto individual dela: Terence paga no cartão e ela repassa, então entra no acerto
function acertoNet(itens) {
  const soma = l => l.reduce((a, i) => a + Number(i.valor), 0), g = itens.filter(i => i.grupo);
  return Math.round((soma(g.filter(i => i.pago_por === 'terence' && i.dono === 'outro')) + soma(itens.filter(ehRepasse)) - soma(g.filter(i => i.pago_por === 'outro' && i.dono === 'terence'))) * 100) / 100;
}
function montarExtrato(m) {
  const outro = m.nome.split('/')[1] || 'Outro', itens = S.itens || [], mes = `${MESES[S.mes.mes]}/${S.mes.ano}`;
  const dela = itens.filter(i => i.dono === 'outro'), div = dela.filter(i => i.grupo), ind = dela.filter(ehRepasse);
  const net = acertoNet(itens), pix = S.cfg?.pix;
  let msg = `📋 *Extrato ${outro} — ${mes}* 📋\n\n`;
  if (!div.length && !ind.length) msg += `Sem lançamentos no período.\n\n`;
  if (div.length) {
    msg += `*Despesas divididas*\n`;
    div.forEach(i => {
      const p = pctPag(i), q = Math.round((100 - p) * 100) / 100;
      msg += `• ${i.nome} — total ${brl(i.valor_total)} (${p}/${q}, pago por ${i.pago_por === 'outro' ? 'você' : 'Terence'}). Sua parte: ${brl(i.valor)}\n`;
    });
    msg += `\n`;
  }
  if (ind.length) {
    msg += `*Despesas individuais*\n`;
    ind.forEach(i => { msg += `• ${i.nome} — ${brl(i.valor)}\n`; });
    msg += `\n`;
  }
  if (net > 0.005) msg += `💰 *Valor a transferir:* ${brl(net)}` + (pix ? `\n\nPIX: ${pix}` : '');
  else if (net < -0.005) msg += `💰 *Terence transfere para você:* ${brl(-net)}`;
  else msg += `✅ Estamos quites neste mês.`;
  return msg;
}

  document.body.innerHTML = '<p style="padding:40px">Preencha SUPABASE_URL e SUPABASE_KEY no topo do script do index.html.</p>';
} else boot();
</script>
